name: Safari extension (iOS)

# Makes the Xcode project of the Safari Web Extension for iPhone and iPad and builds it for the iOS Simulator, unsigned, to see that it compiles. Apple's tool for this
# runs on a Mac only, so this runs on GitHub's. By hand only: Actions > Safari extension (iOS) > Run workflow.
#
# The project is kept as an artifact for a week. Open it in Xcode on a Mac, choose your Team under Signing & Capabilities (for the app and for its extension), and run it
# on a device, or archive it for TestFlight. Nothing is signed here, no secret is used, and the token can only read the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari
  cancel-in-progress: true

jobs:
  safari:
    name: Xcode project
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Unit tests
        run: npm test
      - name: The Xcode project, built for the iOS Simulator
        run: tools/safari.sh --build
      - name: Keep the project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vianney-safari-xcode
          path: dist/safari-xcode
          retention-days: 7
