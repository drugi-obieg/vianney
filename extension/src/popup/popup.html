<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vianney</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="app-icon" src="../../icons/icon128.png" alt="" width="36" height="36">
    <div class="who"><strong>Vianney</strong><span id="status"></span></div>
    <label class="switch" title="Turn Vianney on or off"><input type="checkbox" id="enabled" aria-label="Enable Vianney"><span class="knob"></span></label>
  </header>

  <div class="seg" id="tabs" role="tablist" aria-label="View">
    <button role="tab" data-tab="settings" aria-selected="true">Settings</button>
    <button role="tab" data-tab="activity" aria-selected="false">Activity</button>
  </div>

  <main id="body">
    <section id="settings"></section>
    <section id="activity" hidden></section>
  </main>

  <footer><button id="open">All settings</button></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
