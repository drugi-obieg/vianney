title: Vianney Content Blocker
description: A local, rule-based content filter for YouTube, in the spirit of the Curé d'Ars on guarding the eyes and ears.
lang: en
url: "https://vianney.cc"
baseurl: ""
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - README.md
  - research
  - .gitignore
  - extension
  - tests
  - tools
  - package.json
  - dist
  - e2e-shots
  - sermons.md
  - plan.md
  - rules.md
  - assets/months/stage-test.html
  - assets/months/stage-test.js
  - node_modules
defaults:
  - scope:
      path: ""
    values:
      layout: default
